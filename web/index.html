<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>导航门户 - 安全稳定的网络访问入口</title>
    <meta
      name="description"
      content="稳定、安全、快速的网络访问入口导航页，多线路实时延迟检测，安全跳转保护。"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="/" />
    <link rel="icon" href="/favicon.ico" />

    <!-- 预连接 Crisp，加快客服弹窗加载 -->
    <link rel="preconnect" href="https://client.crisp.chat" crossorigin />
    <link rel="dns-prefetch" href="https://client.crisp.chat" />
    <link rel="preconnect" href="https://client.relay.crisp.chat" crossorigin />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="导航门户 - 安全稳定的网络访问入口" />
    <meta property="og:description" content="稳定、安全、快速的网络访问入口导航页，多线路实时延迟检测。" />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/logo.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="导航门户 - 安全稳定的网络访问入口" />
    <meta name="twitter:description" content="稳定、安全、快速的网络访问入口导航页。" />
    <meta name="twitter:image" content="/logo.png" />

    <link rel="stylesheet" href="/css/style.css?v=19" />
  </head>
  <body>
    <div class="page-shell">
      <div class="tech-bg" aria-hidden="true">
        <div class="tech-grid"></div>
        <div class="tech-scan"></div>
        <div class="tech-glow glow-a"></div>
        <div class="tech-glow glow-b"></div>
        <div class="tech-glow glow-c"></div>

        <span class="network-node node-1"></span>
        <span class="network-node node-2"></span>
        <span class="network-node node-3"></span>
        <span class="network-node node-4"></span>
        <span class="network-node node-5"></span>
        <span class="network-node node-6"></span>

        <span class="network-line line-1"></span>
        <span class="network-line line-2"></span>
        <span class="network-line line-3"></span>
        <span class="network-line line-4"></span>
      </div>

      <main class="portal-wrap">
        <section class="hero-panel hero-panel-single">
          <div class="hero-left">
            <div class="brand-row brand-row-center">
              <div class="brand-logo-wrap brand-logo-image-wrap">
                <img src="/logo.png" alt="Logo" class="brand-logo-image" />
              </div>

              <div class="brand-copy brand-copy-center">
                <div class="brand-tag">SECURE NETWORK ACCESS</div>
                <h1 id="siteName">导航门户</h1>
                <p id="siteSubtitle" class="site-subtitle">安全稳定 · 多线路入口</p>
              </div>
            </div>

            <div class="hero-notice hero-notice-center">
              <div class="notice-label">系统公告</div>
              <div class="notice-content" id="siteNotice">
                谨防失联，牢记域名
              </div>
            </div>

            <div class="hero-actions hero-actions-center">
              <button class="main-action-button" type="button" id="heroButton">
                牢记域名
              </button>
            </div>
          </div>
        </section>

        <section class="content-grid">
          <div class="main-stack">
            <section class="panel panel-links">
              <div class="panel-head">
                <div>
                  <div class="panel-kicker">ACCESS ENTRY</div>
                  <h2 class="panel-title">线路入口</h2>
                  <div class="panel-subtitle">根据你当前网络实时检测访问延迟，仅供参考</div>
                </div>
                <button
                  class="panel-badge panel-badge-button"
                  type="button"
                  id="refreshDelayButton"
                >
                  点击刷新延迟
                </button>
              </div>

              <div class="links-grid" id="linksGrid">
                <div class="error-tip">正在加载线路列表...</div>
              </div>
            </section>

            <section class="panel panel-tg-single">
              <div class="panel-head compact panel-head-center">
                <div>
                  <div class="panel-kicker">OFFICIAL GROUP</div>
                  <h2 class="panel-title panel-title-center">官方TG群组</h2>
                </div>
              </div>

              <div class="entry-tg-wrap tg-single-wrap">
                <a
                  class="sub-action-button entry-tg-button tg-single-button"
                  id="tgButton"
                  href="#"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  点击加入
                </a>
              </div>
            </section>
          </div>
        </section>

        <footer class="site-footer">
          <div class="footer-line"></div>
          <div class="footer-text">
            <span>© <span id="footerYear"></span> Secure Access Portal</span>
            <span class="footer-divider">|</span>
            <span>入口导航 / 稳定访问 / 实时延迟</span>
          </div>
        </footer>
      </main>
    </div>

    <!-- Crisp 客服由 /api/config 返回 crispWebsiteId 后动态加载，无需在此硬编码 -->
    <script src="/js/index.js?v=21"></script>
  </body>
</html>
